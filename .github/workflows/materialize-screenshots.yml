name: Materialize README screenshots

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode screenshots and commit
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for src in docs/images/*.webp.b64; do
            [ -e "$src" ] || continue
            dst="${src%.b64}"
            base64 --decode "$src" > "$dst"
            rm "$src"
            changed=1
          done

          if [ "$changed" -eq 0 ]; then
            echo "No staged screenshot assets found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git commit -m "docs: add README screenshots"
          git push
